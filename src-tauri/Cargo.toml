[package]
name = "folderflow"
version = "0.1.0"
description = "FolderFlow — automatic file organizer for macOS"
edition = "2021"
rust-version = "1.94"
publish = false

[lib]
name = "folderflow_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[lints.rust]
unsafe_code = "deny"

[lints.clippy]
dbg_macro = "deny"
todo = "deny"
unwrap_used = "warn"

[dependencies]
base64 = "0.22"
blake3 = "1.8"
block2 = "0.6"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
ed25519-dalek = "3"
ff-macos-events = { path = "crates/ff-macos-events" }
glob = "0.3"
infer = "0.22.0"
libc = "0.2.191"
notify = "8"
objc2 = "0.6"
objc2-app-kit = { version = "0.3", default-features = false, features = ["std", "NSWorkspace"] }
objc2-foundation = { version = "0.3", default-features = false, features = ["std", "NSBundle", "NSString", "NSURL", "NSFileManager", "NSError"] }
objc2-user-notifications = { version = "0.3", default-features = false, features = [
  "std",
  "block2",
  "UNNotificationContent",
  "UNNotificationRequest",
  "UNNotificationSound",
  "UNNotificationTrigger",
  "UNUserNotificationCenter",
] }
regex = "1"
reqwest = { version = "0.13", default-features = false, features = ["json", "rustls"] }
security-framework = "3"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
smappservice-rs = "0.1"
specta = { version = "=2.0.0-rc.28", features = ["derive"] }
specta-typescript = "=0.0.15"
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "sqlite", "migrate", "macros"] }
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.29", features = ["derive", "typescript"] }
thiserror = "2.0.21"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tracing = "0.1.44"
tracing-appender = "0.2.5"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
unicode-normalization = "0.1.26"
uuid = { version = "1.29.2", features = ["v7", "serde"] }
walkdir = "2.5.0"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dev-dependencies]
proptest = "1.12.0"
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["test-util", "macros", "rt-multi-thread"] }

[profile.dev.package.blake3]
opt-level = 3
