<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024">
  <defs>
    <linearGradient id="ff-bg" x1="140" y1="100" x2="884" y2="924" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#2e8bff" />
      <stop offset="52%" stop-color="#0e64f2" />
      <stop offset="100%" stop-color="#1938b8" />
    </linearGradient>
    <linearGradient id="ff-top-sheen" x1="512" y1="100" x2="512" y2="560" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.28" />
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0" />
    </linearGradient>
    <linearGradient id="ff-folder-back" x1="252" y1="304" x2="772" y2="720" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#d8e7ff" />
      <stop offset="100%" stop-color="#b7d2ff" />
    </linearGradient>
    <linearGradient id="ff-folder-front" x1="252" y1="368" x2="772" y2="752" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#eaf1ff" />
    </linearGradient>
    <linearGradient id="ff-arrow" x1="408" y1="486" x2="628" y2="646" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#1469f5" />
      <stop offset="100%" stop-color="#1a3eb8" />
    </linearGradient>
    <filter id="ff-drop-shadow" x="40" y="60" width="944" height="944" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="22" stdDeviation="24" flood-color="#071538" flood-opacity="0.30" />
    </filter>
    <filter id="ff-card-shadow" x="210" y="270" width="604" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="16" stdDeviation="16" flood-color="#061d56" flood-opacity="0.24" />
    </filter>
  </defs>

  <!-- macOS squircle icon plate -->
  <g filter="url(#ff-drop-shadow)">
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ff-bg)" />
    <rect x="100" y="100" width="824" height="824" rx="186" fill="url(#ff-top-sheen)" />
    <rect x="103" y="103" width="818" height="818" rx="183" fill="none" stroke="#ffffff" stroke-opacity="0.28" stroke-width="6" />
  </g>

  <!-- Subtle stacked document sheets peeking behind the folder front -->
  <g filter="url(#ff-card-shadow)">
    <!-- Folder back & tab -->
    <path
      d="M252 348c0-26.5 21.5-48 48-48h134c16.5 0 32.1 7.6 42.3 20.6L504 356h220c26.5 0 48 21.5 48 48v288c0 26.5-21.5 48-48 48H300c-26.5 0-48-21.5-48-48V348z"
      fill="url(#ff-folder-back)"
    />

    <!-- Crisp sorted paper tabs inside the folder -->
    <rect x="308" y="330" width="408" height="72" rx="18" fill="#f7faff" fill-opacity="0.92" />
    <rect x="332" y="312" width="360" height="52" rx="14" fill="#ffffff" fill-opacity="0.62" />

    <!-- Folder front body -->
    <rect x="252" y="384" width="520" height="356" rx="48" fill="url(#ff-folder-front)" />
    <rect x="254" y="386" width="516" height="352" rx="46" fill="none" stroke="#ffffff" stroke-opacity="0.9" stroke-width="4" />
  </g>

  <!-- Flow mark: three tidy sorted tracks converging into an upward-right/forward organization arrow -->
  <g fill="none" stroke="url(#ff-arrow)" stroke-linecap="round" stroke-linejoin="round">
    <path d="M352 504h96" stroke-width="28" stroke-opacity="0.35" />
    <path d="M352 624h96" stroke-width="28" stroke-opacity="0.35" />
    <path d="M352 564h292" stroke-width="34" />
    <path d="M564 484l84 80-84 80" stroke-width="34" />
  </g>
</svg>
